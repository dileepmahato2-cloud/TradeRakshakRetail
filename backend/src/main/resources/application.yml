# =============================================================================
# TradeRakshak™ v11.5 — Spring Boot Configuration
# Rules: R4-SEBI  R5-Docker  R6-Security  R7-Performance
# =============================================================================
spring:
  application:
    name: TradeRakshak
  profiles:
    active: ${SPRING_PROFILE:dev}

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none              # Flyway owns schema; avoid SQLite metadata validation limit
    show-sql: false
    open-in-view: false           # Avoid lazy-load issues in REST context
    properties:
      hibernate:
        # dialect intentionally omitted - Hibernate 6 resolves PostgreSQLDialect from the
        # JDBC metadata; setting it explicitly only emits the HHH90000025 deprecation warning.
        format_sql: false
        # Phase 4: batch JPA writes and let the PG driver rewrite batched inserts.
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  # ── DataSource (SQLite dev) ─────────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/traderakshak}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      # Each pooled connection costs memory on BOTH sides - JDBC buffers here and a forked
      # backend process in PostgreSQL - so this is one of the cheapest wins on a small box.
      # 8 still leaves room for background sync/warmup + live feed + user requests.
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      connection-init-sql: SET statement_timeout = '180s'; SET lock_timeout = '10s'
      data-source-properties:
        reWriteBatchedInserts: true  # PG driver: collapse JDBC batches into multi-row INSERTs

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/postgresql}
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Multipart (file upload limits) ─────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:1}MB
      max-request-size: 50MB
      enabled: true

  # ── Mail ───────────────────────────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Cache ──────────────────────────────────────────────────────────────────
  cache:
    type: simple

# ── Server ─────────────────────────────────────────────────────────────────────
# ── trep-institution-service (owns the Real Trading gate and risk limits) ────
institution:
  service:
    url: ${INSTITUTION_SERVICE_URL:http://localhost:8081}

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # Spring's default is 200 worker threads, each reserving ~1MB of stack whether or not
      # it is ever used. This is an internal tool with a handful of concurrent users, so the
      # default was pure reservation. Raise SERVER_THREADS_MAX if you front a real user load.
      max: ${SERVER_THREADS_MAX:25}
      min-spare: ${SERVER_THREADS_MIN:5}
    accept-count: ${SERVER_ACCEPT_COUNT:50}
    max-connections: ${SERVER_MAX_CONNECTIONS:200}
  compression:
    enabled: ${SSL_ENABLED:false}
    mime-types: application/json,text/plain,text/csv,text/html,text/javascript,application/javascript

# ── Static resources: Angular SPA embedded in JAR ─────────────────────────────
  # Angular static files are in resources/static/ — served at /
  # Spring Security permits static resources below

# ── App Properties ─────────────────────────────────────────────────────────────
app:
  version: "11.5"
  # R4: SEBI Disclaimer — injected into every API response
  sebi-disclaimer: "⚠ DISCLAIMER: TradeRakshak™ is a Technology Tools Platform. It is NOT a SEBI-registered Investment Advisor or Research Analyst. All content is for educational purposes only. Past performance does not guarantee future results. Consult a SEBI-empanelled advisor before trading."

  jwt:
    secret: ${JWT_SECRET:tr-v114-CHANGE-THIS-to-a-random-32chars-min}
    # BRD §17 L2: 30-minute session idle timeout
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:86400000}

  cors:
    # Angular dev server + prod domain
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

  rate-limit:
    # BRD §17 L5 — rate limiting (replaces slowapi)
    login-per-minute: ${RATE_LIMIT_LOGIN:5}
    api-per-minute: ${RATE_LIMIT_API:100}
    upload-per-minute: ${RATE_LIMIT_UPLOAD:20}

  security:
    # BRD §17 L4: BCrypt cost factor
    bcrypt-strength: 12
    # Login lockout threshold (BRD §17)
    max-failed-logins: 5
    lockout-minutes: 30
    # Fernet key for PAN encryption (BRD §17 L4)
    fernet-key: ${FERNET_KEY:}

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    export-dir: ${EXPORT_DIR:./exports}
    backup-dir: ${BACKUP_DIR:./backups}
    archive-dir: ${ARCHIVE_DIR:./archive}
    data-dir: ${DATA_DIR:./data}
    max-batch-files: ${MAX_BATCH_FILES:250}
    local-data-path: ${LOCAL_DATA_PATH:E:/Share Market/Stock for Server/Stock Market Application}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxx}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  msg91:
    api-key: ${MSG91_API_KEY:}
    sender-id: ${MSG91_SENDER_ID:TRDRK}
    otp-template-id: ${MSG91_OTP_TEMPLATE_ID:}

  recaptcha:
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}

  data-retention-years: ${DATA_RETENTION_YEARS:5}

# ── Bulk data fetch guard ───────────────────────────────────────────────────────
# A full history fetch writes tens of GB. If the drive holding the PostgreSQL data
# directory has less than this much free space, Data Warehouse refuses to start one
# and says how much room is left, rather than running until the disk fills.
data:
  fetch:
    min:
      free:
        gb: ${DATA_FETCH_MIN_FREE_GB:20}

# ── Actuator ────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /api/actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    # TradeRakshak does not send mail, and with no SMTP password configured this indicator
    # reported DOWN - which made /actuator/health return 503 for an application that was
    # running perfectly. Turn it off so the endpoint reflects the parts that actually matter.
    mail:
      enabled: false

# ── Logging ─────────────────────────────────────────────────────────────────────
logging:
  level:
    com.traderakshak: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── SpringDoc / Swagger ──────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    operations-sorter: alpha

---
# ════════════════════════════════════════════════════════════════════════════
# PRODUCTION PROFILE
# ════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    locations: classpath:db/migration/postgresql

server:
  # Let Spring run shutdown hooks instead of dying on the spot. LiveCandleAggregator holds up to
  # one full bar of ticks in memory, so an abrupt exit loses them - see flushOnShutdown().
  shutdown: graceful
  ssl:
    enabled: true

# Live candle aggregation. The width is NOT a free number: the Stock Upload price lookups seek
# forward to the first bar at or after a configured time, so every buy/sell time in use must fall
# on a bar start. Buckets are anchored at the 09:15 session open, giving 09:15, 10:15 ... 15:15 -
# which is also how Dhan stamps its own 60-minute candles, so live and backfilled bars share a key.
livecandle:
  interval:
    minutes: 60
